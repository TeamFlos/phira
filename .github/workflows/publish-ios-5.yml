name: Publish tested iOS build 5
on:
  push:
    branches: [release/ios-0.8.3-1]
    paths: ['.github/workflows/publish-ios-5.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v0.8.3-private-mp-ios.1
    steps:
      - name: Verify and publish device-tested IPA
        run: |
          set -eu
          gh run download 43563980215 -n Phira-iOS-unsigned
          echo 'ad2100ba31c35d7ad5706d31f74638d78d1649e37717f2eafb8bd85ac592f74e  Phira-iOS-unsigned.ipa' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh release create "$TAG" Phira-iOS-unsigned.ipa SHA256SUMS.txt --target "$GITHUB_SHA" --latest=false --title 'Phira 0.8.3 for iOS — Private Multiplayer Edition' --notes 'Built from e39608f. Build 5 for arm64 iPhone and iPad includes private room chart sharing and the startup asset fix. Sign the IPA with your usual sideloading tool, then set Multiplayer Server Address to your matching protocol v2 server. Startup was verified in an iPhone simulator and the maintainer reports successful use on device.'
